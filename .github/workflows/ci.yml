name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# dorny/test-reporter 需要 checks:write 才能创建 check run 并发布注解，
# 缺省 GITHUB_TOKEN 只有 read，会在 Publish Test Results 步骤 403
permissions:
  checks: write
  contents: read
  pull-requests: write

jobs:
  test-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Compile & test (gateway-core)
        run: ./mvnw -pl gateway-core -am -q test
      - name: Integration tests (gateway-core)
        run: ./mvnw -pl gateway-core -am failsafe:integration-test failsafe:verify
      - name: Publish Test Results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Core Tests
          path: 'gateway-core/target/surefire-reports/TEST-*.xml,gateway-core/target/failsafe-reports/TEST-*.xml'
          reporter: java-junit

  test-admin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Compile & test (gateway-admin)
        run: ./mvnw -pl gateway-admin -am -q test
      - name: Install reactor modules for ITs
        # failsafe:integration-test 作为直接目标调用时不从 reactor 解析模块依赖，
        # 必须先把根 POM 与 gateway-core 装进本地仓库（与本地 verify-all 同源问题）
        run: ./mvnw -pl gateway-admin -am install -DskipTests -q
      - name: Integration tests (gateway-admin)
        run: |
          ./mvnw -pl gateway-admin failsafe:integration-test failsafe:verify 2>&1 | tee /tmp/it-admin.log
          exit ${PIPESTATUS[0]}
      - name: Print integration test failures
        if: failure()
        run: |
          echo "===== failsafe-reports 目录清单 ====="
          ls -la gateway-admin/target/failsafe-reports/ 2>/dev/null || echo "(不存在)"
          ls -la gateway-core/target/failsafe-reports/ 2>/dev/null || echo "(不存在)"
          echo "===== 报告摘要 ====="
          for f in gateway-admin/target/failsafe-reports/*.txt gateway-core/target/failsafe-reports/*.txt; do
            [ -f "$f" ] || continue
            echo "--- $f ---"
            grep -E "Tests run|<<< (FAILURE|ERROR)!|Caused by" "$f" | head -25
          done
          echo "===== maven 日志尾部（最后 100 行）====="
          tail -100 /tmp/it-admin.log
      - name: Upload integration test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-reports
          path: |
            gateway-admin/target/failsafe-reports/
            gateway-core/target/failsafe-reports/
            /tmp/it-admin.log
          if-no-files-found: ignore
      - name: Publish Test Results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Admin Tests
          path: 'gateway-admin/target/surefire-reports/TEST-*.xml,gateway-admin/target/failsafe-reports/TEST-*.xml'
          reporter: java-junit

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: frontend
      - name: Lint frontend
        run: npm run lint
        working-directory: frontend
      - name: Test frontend
        run: npm run test
        working-directory: frontend
      - name: Build frontend
        run: npm run build
        working-directory: frontend

  checkstyle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Checkstyle (gateway-core)
        run: ./mvnw -pl gateway-core -q checkstyle:check
      - name: Checkstyle (gateway-admin)
        run: ./mvnw -pl gateway-admin -q checkstyle:check
      - name: Checkstyle (bootstrap)
        run: ./mvnw -pl bootstrap -q checkstyle:check

  regression:
    needs: [test-core, test-admin, frontend, checkstyle]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Full regression test
        run: ./scripts/regression.sh

  supplement:
    needs: [test-core, test-admin, frontend, checkstyle]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build JAR
        run: ./mvnw -pl bootstrap -am package -DskipFrontendBuild=true -DskipTests -q
      - name: Supplement tests
        run: ./scripts/verify-supplement.sh
      - name: User journey blackbox
        run: ./scripts/user-journey-blackbox.sh
